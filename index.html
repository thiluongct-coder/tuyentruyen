<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trung tâm Trải nghiệm Số</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b1121;
            =
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridSlide 20s linear infinite;
            color: #e2e8f0; 
            line-height: 1.6; 
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gridSlide {
            0% { background-position: 0px 0px; }
            100% { background-position: 40px 40px; }
        }

        
        body::before, body::after {
            content: ''; position: fixed; width: 40vw; height: 40vw;
            border-radius: 50%; filter: blur(120px); z-index: -1;
            animation: floatOrb 10s ease-in-out infinite alternate;
        }
        body::before { top: -10%; left: -10%; background: rgba(0, 240, 255, 0.15); }
        body::after { bottom: -10%; right: -10%; background: rgba(139, 92, 246, 0.15); animation-delay: -5s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 8%; 
            background: rgba(11, 17, 33, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { 
            font-weight: 700; font-size: 1.3rem; color: #00f0ff; 
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            letter-spacing: 1px; text-transform: uppercase;
        }
        .random-btn { 
            background: rgba(0, 240, 255, 0.1); 
            border: 1px solid rgba(0, 240, 255, 0.4); 
            padding: 10px 20px; border-radius: 8px; color: #00f0ff; 
            cursor: pointer; font-weight: 600; transition: 0.3s; 
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }
        .random-btn:hover { 
            background: rgba(0, 240, 255, 0.25); 
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); 
            transform: scale(1.05); text-shadow: 0 0 8px #00f0ff;
        }

        
        .hero { 
            text-align: center; padding: 100px 5%; 
            background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1600&auto=format&fit=crop'); 
            background-size: cover; background-position: center; 
            position: relative; color: white; 
        }
        
        .hero::before { 
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(to bottom, rgba(11, 17, 33, 0.8), #0b1121); 
        }
        .hero h1 { 
            position: relative; z-index: 2; font-size: 2.5rem; margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }
        .search-box { position: relative; width: 100%; max-width: 600px; margin: 0 auto; z-index: 2; }
        .search-box input { 
            width: 100%; padding: 18px 25px; border-radius: 50px; 
            background: rgba(16, 24, 45, 0.7); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.3); color: #fff;
            font-size: 1.1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            outline: none; transition: all 0.3s ease;
        }
        .search-box input:focus { 
            border-color: #00f0ff; box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); 
            background: rgba(16, 24, 45, 0.9);
        }
        .search-box input::placeholder { color: #64748b; }
        
        
        .main-content { padding-bottom: 50px; position: relative; z-index: 10; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; padding: 50px 8%; }
        
        .card { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px);
            padding: 35px; border-radius: 20px; text-align: center; cursor: pointer; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
        }
        
        
        .card::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transform: skewX(-20deg); transition: 0.6s; z-index: 1; pointer-events: none;
        }
        .card:hover::after { left: 200%; }
        .card:hover { transform: translateY(-10px); }

        
        .card:nth-child(1) { border-top: 4px solid #3b82f6; } /* Xanh lam - CĐS */
        .card:nth-child(1):hover { box-shadow: 0 15px 35px rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.4); }
        
        .card:nth-child(2) { border-top: 4px solid #10b981; } /* Xanh ngọc - Giao thông */
        .card:nth-child(2):hover { box-shadow: 0 15px 35px rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.4); }
        
        .card:nth-child(3) { border-top: 4px solid #8b5cf6; } /* Tím - PCTP */
        .card:nth-child(3):hover { box-shadow: 0 15px 35px rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.4); }
        
        .card:nth-child(4) { border-top: 4px solid #ef4444; } /* Đỏ - PCCC */
        .card:nth-child(4):hover { box-shadow: 0 15px 35px rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); }

        
        .icon-box { 
            font-size: 3.5rem; margin-bottom: 20px; display: block; 
            position: relative; z-index: 2; filter: drop-shadow(0 0 15px rgba(255,255,255,0.2)); 
        }
        .card h3 { color: #f8fafc; font-size: 1.4rem; margin-bottom: 10px; position: relative; z-index: 2;}
        .card p { color: #94a3b8; margin-bottom: 25px; position: relative; z-index: 2;}
        
        .btn-card { 
            display: inline-block; padding: 10px 24px; border-radius: 50px; font-weight: 600; 
            background: transparent; color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.15);
            transition: 0.3s; position: relative; z-index: 2;
        }
        .card:hover .btn-card { background: rgba(255, 255, 255, 0.1); color: #fff; border-color: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body>
    <header>
        <div class="logo">TRUNG TÂM TRẢI NGHIỆM SỐ</div>
        <nav><button class="random-btn" onclick="randomExplore()">🎲 Khám phá ngẫu nhiên</button></nav>
    </header>
    <section class="hero">
        <h1>Bạn muốn khám phá điều gì hôm nay?</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm kiếm nhanh: luật, mẹo lái xe, pccc, tội phạm...">
        </div>
    </section>
    <main class="main-content">
        <section class="grid" id="cardGrid">
            <div class="card" onclick="location.href='ChuyenDoiSo/index.html'">
                <span class="icon-box">🌐</span><h3>Chuyển đổi số</h3><p>Nghị quyết 57, Đề án 06...</p><div class="btn-card">Xem ngay</div>
            </div>
            <div class="card" onclick="location.href='GiaoThong/index.html'">
                <span class="icon-box">🚦</span><h3>Giao thông</h3><p>Mô phỏng lái xe...</p><div class="btn-card">Xem ngay</div>
            </div>
            <div class="card" onclick="location.href='PCTP/index.html'">
                <span class="icon-box">🛡️</span><h3>Phòng chống tội phạm</h3><p>Nhận diện thủ đoạn AI...</p><div class="btn-card">Xem ngay</div>
            </div>
            <div class="card" onclick="location.href='PCCC/index.html'">
                <span class="icon-box">🔥</span><h3>PCCC</h3><p>Hướng dẫn thoát hiểm...</p><div class="btn-card">Xem ngay</div>
            </div>
        </section>
    </main>

    <script>
        document.getElementById('searchInput').addEventListener('input', function() {
            const val = this.value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(val) ? 'block' : 'none';
            });
        });

        function randomExplore() {
            const options = [
                { name: "Chuyển đổi số", url: "ChuyenDoiSo/index.html" },
                { name: "Giao thông", url: "GiaoThong/index.html" },
                { name: "Phòng chống tội phạm", url: "PCTP/index.html" },
                { name: "PCCC", url: "PCCC/index.html" }
            ];
            const randomItem = options[Math.floor(Math.random() * options.length)];
            
            if (confirm("🎲 Hôm nay hệ thống gợi ý bạn khám phá: " + randomItem.name + ". Bạn có muốn bắt đầu ngay?")) {
                location.href = randomItem.url;
            }
        }
    </script>
</body>
</html>
