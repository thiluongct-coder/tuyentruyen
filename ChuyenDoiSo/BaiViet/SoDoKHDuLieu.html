
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sơ đồ Tư duy Dữ liệu Cần Thơ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Quicksand', sans-serif; 
            margin: 0; min-height: 100vh; 
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); 
            display: flex; flex-direction: column; align-items: center; color: white; padding: 20px;
        }
        
        h1 { margin-bottom: 40px; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        .container { display: flex; gap: 50px; flex-wrap: wrap; justify-content: center; }
        
        .root { 
            background: radial-gradient(circle, #ff9a9e, #fad0c4); 
            width: 220px; height: 220px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            text-align: center; font-weight: 700; color: #333; cursor: pointer;
            box-shadow: 0 0 30px rgba(255,154,158,0.6); transition: 0.5s;
        }
        .root:hover { transform: scale(1.1) rotate(5deg); }
        
        .branch { 
            padding: 20px; border-radius: 15px; cursor: pointer; margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2); transition: 0.4s;
            display: flex; align-items: center; font-weight: 600;
        }
        .branch:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        
        .modal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95); color: #333; padding: 30px; 
            border-radius: 25px; width: 50%; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 100; border: 2px solid white;
        }
    </style>
</head>
<body>
    <h1>Sơ đồ Kế hoạch Dữ liệu Cần Thơ</h1>
    <div class="container">
        <div class="root" onclick="show('main')">Kế hoạch 196/KH-UBND</div>
        <div class="branches">
            <div class="branch" onclick="show('muc-dich')" style="border-left: 10px solid #ff9a9e;">I. Mục đích yêu cầu</div>
            <div class="branch" onclick="show('muc-tieu')" style="border-left: 10px solid #a18cd1;">II. Mục tiêu đến 2030</div>
            <div class="branch" onclick="show('nhiem-vu')" style="border-left: 10px solid #84fab0;">III. Nhiệm vụ & Giải pháp</div>
            <div class="branch" onclick="show('kinh-phi')" style="border-left: 10px solid #fbc2eb;">IV. Kinh phí</div>
            <div class="branch" onclick="show('to-chuc')" style="border-left: 10px solid #f6d365;">V. Tổ chức thực hiện</div>
        </div>
    </div>

    <div class="modal" id="modal">
        <h2 id="title" style="color: #444;"></h2>
        <div id="body" style="font-size: 1.1em;"></div>
        <button onclick="hide()" style="margin-top:20px; cursor:pointer; background:#333; color:white; padding:10px 20px; border-radius:10px;">Đóng lại</button>
    </div>

    <script>
        const data = {
            'main': { title: 'Tổng quan', body: 'Kế hoạch phát triển dữ liệu số thành phố Cần Thơ đến năm 2030, hướng đến xây dựng chính quyền số và kinh tế số vững mạnh.' },
            'muc-dich': { title: 'Mục đích Yêu cầu', body: '<ul><li>Triển khai Chiến lược dữ liệu quốc gia</li><li>Thúc đẩy chuyển đổi số bền vững</li><li>Nâng cao năng lực quản trị dữ liệu</li></ul>' },
            'muc-tieu': { title: 'Mục tiêu đến 2030', body: '<ul><li>Dữ liệu là nền tảng số hóa.</li><li>Chuẩn hóa dữ liệu dùng chung.</li><li>100% TTHC được số hóa.</li></ul>' },
            'nhiem-vu': { title: 'Nhiệm vụ & Giải pháp', body: '<ul><li>Phát triển hạ tầng Trung tâm dữ liệu.</li><li>Kết nối liên thông các ngành qua LGSP.</li><li>Phát triển CSDL chuyên ngành.</li></ul>' },
            'kinh-phi': { title: 'Kinh phí', body: '<p>Sử dụng ngân sách nhà nước, kết hợp huy động nguồn vốn từ doanh nghiệp và xã hội hóa.</p>' },
            'to-chuc': { title: 'Tổ chức thực hiện', body: '<p>Sở KH&CN chủ trì, phối hợp với Công an TP, Sở Tài chính và các đơn vị liên quan.</p>' }
        };
        function show(id) {
            document.getElementById('title').innerText = data[id].title;
            document.getElementById('body').innerHTML = data[id].body;
            document.getElementById('modal').style.display = 'block';
        }
        function hide() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
